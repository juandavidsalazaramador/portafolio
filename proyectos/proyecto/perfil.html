<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del usuario</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .perfil {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,.12);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .foto-principal {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #eee;
        }

        h1 {
            margin: 15px 0 5px;
        }

        .subtitulo {
            color: #666;
        }

        .seccion {
            margin-top: 28px;
        }

        .seccion h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .datos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 14px;
        }

        .dato {
            background: #f7f7f7;
            padding: 14px;
            border-radius: 10px;
        }

        .dato strong {
            display: block;
            margin-bottom: 5px;
        }

        .fotos {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .fotos img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
        }

        #mapa {
            width: 100%;
            height: 400px;
            border: 0;
            border-radius: 14px;
            margin-top: 15px;
        }

        .boton-maps {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .error {
            text-align: center;
            color: #b00020;
            padding: 30px;
        }
    </style>
</head>

<body>

    <main class="perfil" id="perfil">
        <div class="encabezado">
            <img id="foto" class="foto-principal" src="" alt="Foto del usuario">
            <h1 id="nombre">Cargando...</h1>
            <p id="subtitulo" class="subtitulo"></p>
        </div>

        <section class="seccion">
            <h2>Información personal</h2>
            <div class="datos" id="datos-personales"></div>
        </section>

        <section class="seccion">
            <h2>Información de contacto</h2>
            <div class="datos" id="datos-contacto"></div>
        </section>
<section class="seccion">
            <h2>Ubicación</h2>
            <div class="datos" id="datos-ubicacion"></div>

            <iframe
                id="mapa"
                loading="lazy"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
                title="Ubicación del usuario">
            </iframe>

            <a id="boton-maps" class="boton-maps" href="#" target="_blank" rel="noopener noreferrer">
                📍 Ver ubicación en Google Maps
            </a>
        </section>

        <section class="seccion">
            <h2>Fotografías</h2>
            <div class="fotos" id="fotos"></div>
        </section>
    </main>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const uuid = parametros.get("usuario");

        const usuariosGuardados = localStorage.getItem("usuarios");

        if (!uuid || !usuariosGuardados) {
            mostrarError("No se pudo encontrar el usuario.");
        } else {
            const usuarios = JSON.parse(usuariosGuardados);
            const usuario = usuarios.find(u => u.login && u.login.uuid === uuid);

            if (!usuario) {
                mostrarError("El usuario no existe en los 100 usuarios guardados.");
            } else {
                mostrarPerfil(usuario);
            }
        }

        function mostrarPerfil(usuario) {
            const nombreCompleto =
                `${usuario.name.title} ${usuario.name.first} ${usuario.name.last}`;

            document.title = `Perfil - ${usuario.name.first} ${usuario.name.last}`;

            document.getElementById("foto").src = usuario.picture.large;
            document.getElementById("foto").alt = `Foto de ${nombreCompleto}`;

            document.getElementById("nombre").textContent = nombreCompleto;
            document.getElementById("subtitulo").textContent =
                `Nacionalidad: ${usuario.nat}`;

            document.getElementById("datos-personales").innerHTML = `
                <div class="dato"><strong>Género</strong>${usuario.gender}</div>
                <div class="dato"><strong>Nombre</strong>${usuario.name.first}</div>
                <div class="dato"><strong>Apellido</strong>${usuario.name.last}</div>
                <div class="dato"><strong>Título</strong>${usuario.name.title}</div>
                <div class="dato"><strong>Edad</strong>${usuario.dob.age}</div>
                <div class="dato"><strong>Fecha de nacimiento</strong>${formatearFecha(usuario.dob.date)}</div>
                <div class="dato"><strong>Nacionalidad</strong>${usuario.nat}</div>
            `;

            document.getElementById("datos-contacto").innerHTML = `
                <div class="dato"><strong>Email</strong>${usuario.email}</div>
                <div class="dato"><strong>Teléfono</strong>${usuario.phone}</div>
                <div class="dato"><strong>Celular</strong>${usuario.cell}</div>
            `;
const location = usuario.location;
            const street = location.street || {};
            const coordinates = location.coordinates || {};
            const timezone = location.timezone || {};

            document.getElementById("datos-ubicacion").innerHTML = `
                <div class="dato"><strong>País</strong>${location.country}</div>
                <div class="dato"><strong>Estado / región</strong>${location.state}</div>
                <div class="dato"><strong>Ciudad</strong>${location.city}</div>
                <div class="dato"><strong>Calle</strong>${street.name || "No disponible"}</div>
                <div class="dato"><strong>Número</strong>${street.number || "No disponible"}</div>
                <div class="dato"><strong>Código postal</strong>${location.postcode}</div>
                <div class="dato"><strong>Latitud</strong>${coordinates.latitude}</div>
                <div class="dato"><strong>Longitud</strong>${coordinates.longitude}</div>
                <div class="dato"><strong>Zona horaria</strong>${timezone.offset || ""} ${timezone.description || ""}</div>
            `;

            const lat = coordinates.latitude;
            const lon = coordinates.longitude;

            const mapa = document.getElementById("mapa");
            const ubicacion = `${lat},${lon}`;

            // Mapa de Google Maps usando directamente las coordenadas
            // entregadas por Random User.
            mapa.src =
                `https://www.google.com/maps?q=${encodeURIComponent(ubicacion)}&z=15&output=embed`;

            // Botón para abrir Google Maps en una pestaña nueva.
            const botonMaps = document.getElementById("boton-maps");
            botonMaps.href =
                `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ubicacion)}`;

            document.getElementById("fotos").innerHTML = `
                <img src="${usuario.picture.large}" alt="Foto grande">
                <img src="${usuario.picture.medium}" alt="Foto mediana">
                <img src="${usuario.picture.thumbnail}" alt="Foto pequeña">
            `;
        }

        function formatearFecha(fecha) {
            if (!fecha) return "No disponible";

            const date = new Date(fecha);

            return date.toLocaleString("es-CO", {
                dateStyle: "long",
                timeStyle: "short"
            });
        }

        function mostrarError(mensaje) {
            document.getElementById("perfil").innerHTML =
                `<div class="error"><h2>${mensaje}</h2></div>`;
        }
    </script>

</body>
</html>
